name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          cli: v3.9.0
          target: Win64
          combine: true
          bindings-ref: 5129d7d6dc7a1b7d6770a8a422e1b5266bed704e

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: ["build"]
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Autoplayer
          path: ${{ steps.build.outputs.build-output }}
